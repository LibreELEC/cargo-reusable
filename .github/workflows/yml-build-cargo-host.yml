name: yml-build-cargo-host
on:
  workflow_call:
    inputs:
      runner:
        description: "set runs-on for host arch"
        required: true
        type: string
      debug:
        description: "Provide debug output from GHA run"
        required: true
        type: string
      ephemeral:
        description: "Target and build-root are ephemeral"
        required: true
        type: string
      upload_url:
        description: "Release upload url"
        required: true
        type: string
      buildcmd:
        description: "build command to run"
        required: true
        type: string
      gitref:
        description: "git branch or hash to build"
        required: true
        type: string
      group:
        description: "concurrency group"
        required: true
        type: string
      project:
        description: "target project"
        required: true
        type: string
      arch:
        description: "target arch"
        required: true
        type: string
      device:
        description: "target device"
        default: ""
        required: false
        type: string
      version:
        description: "OS_VERSION, the first half of the release tag"
        required: true
        type: string
      rust:
        description: "rust version we are building"
        required: true
        type: string
      buildos:
        description: "docker image to build with"
        required: true
        type: string

env:
  # Distro Target Variables
  PROJECT: ${{ inputs.project }}
  ARCH: ${{ inputs.arch }}
  DEVICE: ${{ inputs.device }}
  RELEASE_TAG: ${{ inputs.version }}-${{ inputs.rust }}
  BUILD_OS: ${{ inputs.buildos }}
  SLACK_WEBHOOK: ${{ secrets.ADDONS_REPO_WEBHOOK_URL }}

concurrency:
  group: ${{ inputs.group }}
  cancel-in-progress: false

jobs:
  build_image:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write

    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.gitref }}
          fetch-depth: 2
          repository: "${{ github.repository_owner }}/LibreELEC.tv"
          path: "LibreELEC.tv"

      # before anything sources config/options, as the options file would
      # otherwise override BUILD_REUSABLE
      - name: Customise the checked out git repository
        run: |
          cd LibreELEC.tv
          sed -i -e "s/RUN useradd docker/RUN useradd docker -o -u $(id -u)/" tools/docker/resolute/Dockerfile
          sed -i -e 's/BUILD_REUSABLE=""/BUILD_REUSABLE="cargo:host"/' distributions/LibreELEC/options
          sed -i -e 's/USE_REUSABLE="[a-z]*"/USE_REUSABLE="no"/' distributions/LibreELEC/options
          grep -E '^\s*(BUILD|USE)_REUSABLE=' distributions/LibreELEC/options

      # the archive name carries the host, the target and a hash of the rust
      # and cargo recipes, so ask the tree for it and skip a build that has
      # already been published
      - id: archive
        name: Resolve the archive name and check the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd LibreELEC.tv
          name=$(bash -c '. config/options rust >/dev/null 2>&1; echo "${PKG_REUSABLE_SOURCE_NAME}"')
          if [ -z "${name}" ]; then
            echo "unable to resolve the cargo-reusable archive name"
            exit 1
          fi
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
          echo "archive: ${name}"
          if gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -qxF "${name}"; then
            echo "${name} is already published, nothing to build"
            echo "build=false" >> "${GITHUB_OUTPUT}"
          else
            echo "build=true" >> "${GITHUB_OUTPUT}"
          fi

      # rust, llvm and the toolchain need far more disk than a hosted runner
      # leaves free by default
      - name: Free disk space
        if: steps.archive.outputs.build == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /

      - name: Create docker image for build
        if: steps.archive.outputs.build == 'true'
        run: |
          cd LibreELEC.tv
          echo "Building with ${{ env.BUILD_OS }}"
          docker build --pull -t gh-${{ github.run_id }} tools/docker/${{ env.BUILD_OS }}

      - name: Prepare the LibreELEC.tv directory - do not leave files behind
        if: steps.archive.outputs.build == 'true' && inputs.ephemeral == 'ephemeral'
        run: |
          echo "build_dir=/build" >> $GITHUB_ENV
          echo "CCACHE_DISABLE=1" >> $GITHUB_ENV

      - name: Display environment
        if: steps.archive.outputs.build == 'true' && inputs.debug == 'debug'
        run: |
          cd LibreELEC.tv
          echo "pwd: $(pwd)"
          echo "id: $(id)"
          echo "docker images: $(docker images)"
          echo "inputs.debug: ${{ inputs.debug }}"
          echo "inputs.ephemeral: ${{ inputs.ephemeral }}"
          echo "lscpu:"
          lscpu
          df -h .

      - name: Build LE in docker container
        if: steps.archive.outputs.build == 'true'
        run: |
          cd LibreELEC.tv
          docker run --rm -v `pwd`:/build \
                          -w /build -i \
                          -e PROJECT=${{ env.PROJECT }} \
                          -e ARCH=${{ env.ARCH }} \
                          -e DEVICE=${{ env.DEVICE }} \
                          -e ONELOG=no -e LOGCOMBINE=fail \
                          -e BUILD_DIR=${{ env.build_dir }} \
                          -e CCACHE_DISABLE=${{ env.CCACHE_DISABLE }} \
                          gh-${{ github.run_id }} ${{ inputs.buildcmd }}
        continue-on-error: true

      # the build directory carries OS_VERSION and DISTRO_VERSION, so find it
      # rather than spell it out
      - id: builddir
        name: Locate the build directory
        if: steps.archive.outputs.build == 'true'
        run: |
          cd LibreELEC.tv
          dir=$(ls -d build.LibreELEC-* 2>/dev/null | head -1)
          echo "dir=${dir}" >> "${GITHUB_OUTPUT}"
          echo "build directory: ${dir}"

      - name: Prepare artifacts - ephemeral
        if: steps.archive.outputs.build == 'true' && inputs.ephemeral == 'ephemeral'
        run: |
          cd LibreELEC.tv
          dir="${{ steps.builddir.outputs.dir }}"
          mkdir -p "${dir}/artifact"
          grep ^FAIL "${dir}/.threads/joblog" 2>/dev/null | \
            awk '{ print $5, $12 }' | tr ':' '_' | \
              while read failedpkg failedlog; do
                mv $(echo ${failedlog} | sed 's#/build/##') \
                  "${dir}/artifact/${dir}-${failedpkg}-$(echo ${failedlog} | sed 's#.*/##')"
              done

      - name: Upload failed artifacts - ephemeral
        if: steps.archive.outputs.build == 'true' && inputs.ephemeral == 'ephemeral'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.group }}-failed
          path: LibreELEC.tv/${{ steps.builddir.outputs.dir }}/artifact/
          if-no-files-found: ignore

      - name: Collect failed build information
        id: failures
        if: steps.archive.outputs.build == 'true'
        run: |
          dir="LibreELEC.tv/${{ steps.builddir.outputs.dir }}"
          joblog="${dir}/.threads/joblog"
          title="${{ env.PROJECT }}.${{ env.ARCH }}-rust-${{ inputs.rust }}"
          if [ ! -f "${joblog}" ]; then
            echo "has_failures=true" >> "${GITHUB_OUTPUT}"
            {
              echo "text<<EOF"
              echo "*${title}* (${{ inputs.version }})\nno build ran\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          failed_lines=$(grep ^FAIL "${joblog}" 2>/dev/null || true)
          if [ -z "${failed_lines}" ]; then
            echo "has_failures=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          total=$(python3 -c "import json; print(len(json.load(open('${dir}/.threads/plan.json'))))" 2>/dev/null)
          [ -z "${total}" ] && total=$(wc -l < "${joblog}" | tr -d ' ')
          text="*${title}* (${{ inputs.version }})\n"
          while IFS= read -r line; do
            step=$(awk '{ print $2 }' <<< "${line}")
            pkg=$(awk '{ print $5 }' <<< "${line}")
            text+="step [${step}/${total}] ${pkg}\n"
          done <<< "${failed_lines}"
          text+="<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
          {
            echo "has_failures=true"
            echo "text<<EOF"
            echo "${text}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Notify failed cargo builds
        if: steps.failures.outputs.has_failures == 'true' && env.SLACK_WEBHOOK != ''
        uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ secrets.ADDONS_REPO_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            username: "ADDON Bot"
            icon_emoji: ":ghost:"
            channel: "${{ secrets.ADDONS_REPO_WEBHOOK_CHANNEL }}"
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: ":red_circle: Build failures"
                  emoji: true
              - type: section
                text:
                  type: mrkdwn
                  text: "${{ steps.failures.outputs.text }}"

      - name: Fail the job on build failures
        if: steps.failures.outputs.has_failures == 'true'
        run: |
          echo "the build failed, see the failed artifacts"
          exit 1

      - name: Clean up - remove docker image tag
        if: always() && steps.archive.outputs.build == 'true'
        run: |
          docker image rm -f gh-${{ github.run_id }}

      - name: List files in target
        if: steps.archive.outputs.build == 'true'
        run: |
          cd LibreELEC.tv
          ls -lah target/
          test -f "target/${{ steps.archive.outputs.name }}"

      - name: upload reusable rust:host and cargo:host
        if: steps.archive.outputs.build == 'true'
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ inputs.upload_url }}
          asset_path: LibreELEC.tv/target/${{ steps.archive.outputs.name }}
          asset_content_type: application/x-xz
          github_token: ${{ github.token }}

      - name: upload reusable rust:host and cargo:host sha256
        if: steps.archive.outputs.build == 'true'
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ inputs.upload_url }}
          asset_path: LibreELEC.tv/target/${{ steps.archive.outputs.name }}.sha256
          asset_content_type: text/plain
          github_token: ${{ github.token }}

      - name: Notify job failure
        if: failure() && steps.failures.outputs.has_failures != 'true' && env.SLACK_WEBHOOK != ''
        uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ secrets.ADDONS_REPO_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            username: "ADDON Bot"
            icon_emoji: ":ghost:"
            channel: "${{ secrets.ADDONS_REPO_WEBHOOK_CHANNEL }}"
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: ":red_circle: Job failed"
                  emoji: true
              - type: section
                text:
                  type: mrkdwn
                  text: "*${{ inputs.group }}*\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
